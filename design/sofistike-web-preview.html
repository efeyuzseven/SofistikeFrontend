.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

&lt;div id=&quot;sofistike-brand-prototype&quot;&gt;
  &lt;style&gt;
    #sofistike-brand-prototype {
      --paper: var(--background);
      --ink: var(--foreground);
      --line: var(--border);
      --cream: color-mix(in srgb, var(--muted) 58%, var(--background));
      --rose: color-mix(in srgb, var(--viz-series-1) 17%, var(--background));
      --lavender: color-mix(in srgb, var(--viz-series-2) 18%, var(--background));
      --sage: color-mix(in srgb, var(--viz-series-3) 17%, var(--background));
      --peach: color-mix(in srgb, var(--viz-series-4) 17%, var(--background));
      --aqua: color-mix(in srgb, var(--viz-series-5) 17%, var(--background));
      color: var(--ink);
      background: var(--paper);
      overflow: clip;
    }

    #sofistike-brand-prototype * { box-sizing: border-box; }
    #sofistike-brand-prototype a { color: inherit; text-decoration: none; }
    #sofistike-brand-prototype section { scroll-margin-top: 7.5rem; }
    #sofistike-brand-prototype .wrap { width: min(100%, 1280px); margin-inline: auto; padding-inline: 1.1rem; }
    #sofistike-brand-prototype .section { padding-block: 3.5rem; border-top: 1px solid var(--line); }
    #sofistike-brand-prototype .section-head { display: flex; justify-content: space-between; align-items: end; gap: 1.5rem; margin-bottom: 1.5rem; }
    #sofistike-brand-prototype .section-head &gt; div { max-width: 44rem; }
    #sofistike-brand-prototype .kicker { color: var(--muted-foreground); text-transform: uppercase; letter-spacing: .1em; }
    #sofistike-brand-prototype .accent-line { height: .25rem; width: 5.5rem; background: var(--primary); margin-block: .75rem; }

    #sofistike-brand-prototype .utility { background: var(--cream); border-bottom: 1px solid var(--line); }
    #sofistike-brand-prototype .utility-row { display: flex; justify-content: flex-end; align-items: center; gap: 1rem; min-height: 2.2rem; flex-wrap: wrap; }
    #sofistike-brand-prototype .utility a { color: var(--muted-foreground); }
    #sofistike-brand-prototype .header { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--paper) 95%, transparent); border-bottom: 1px solid var(--line); }
    #sofistike-brand-prototype .nav-row { min-height: 4.6rem; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 1.75rem; }
    #sofistike-brand-prototype .logo-image { width: 9rem; max-height: 3.5rem; object-fit: contain; object-position: left center; }
    #sofistike-brand-prototype .nav { display: flex; justify-content: center; align-items: center; gap: 1.8rem; }
    #sofistike-brand-prototype .nav-link { display: inline-flex; gap: .35rem; align-items: center; padding-block: 1.55rem; border-bottom: 2px solid transparent; }
    #sofistike-brand-prototype .nav-link:hover,
    #sofistike-brand-prototype .nav-link:focus-visible { border-bottom-color: var(--primary); }
    #sofistike-brand-prototype .nav-actions { display: flex; align-items: center; gap: .35rem; }
    #sofistike-brand-prototype .search { display: flex; align-items: center; gap: .5rem; padding-inline: .85rem; border: 1px solid var(--input); border-radius: 999px; }
    #sofistike-brand-prototype .search input { border: 0; outline: 0; background: transparent; color: var(--ink); padding-block: .55rem; min-width: 9rem; }
    #sofistike-brand-prototype .shop-wrap { position: static; }
    #sofistike-brand-prototype .mega { display: none; position: absolute; inset-inline: 0; top: 100%; background: var(--popover); color: var(--popover-foreground); border-bottom: 1px solid var(--line); padding-block: 1.4rem; }
    #sofistike-brand-prototype .shop-wrap:hover .mega,
    #sofistike-brand-prototype .shop-wrap:focus-within .mega { display: block; }
    #sofistike-brand-prototype .mega-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
    #sofistike-brand-prototype .mega-group { padding: 1.1rem; background: var(--rose); }
    #sofistike-brand-prototype .mega-group:nth-child(2) { background: var(--lavender); }
    #sofistike-brand-prototype .mega-group:nth-child(3) { background: var(--aqua); }
    #sofistike-brand-prototype .mega-group h3 { margin-top: 0; }
    #sofistike-brand-prototype .mega-list { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: .35rem .8rem; }
    #sofistike-brand-prototype .mega-list a { display: flex; align-items: center; gap: .4rem; }
    #sofistike-brand-prototype .mega-list a:hover { text-decoration: underline; }

    #sofistike-brand-prototype .hero { display: grid; grid-template-columns: minmax(20rem, .86fr) minmax(0, 1.14fr); min-height: 31rem; background: var(--cream); }
    #sofistike-brand-prototype .hero-manifesto { display: grid; place-items: center; padding: 1.25rem; background: var(--cream); }
    #sofistike-brand-prototype .hero-manifesto img { width: 100%; height: 100%; max-height: 31rem; object-fit: contain; }
    #sofistike-brand-prototype .hero-stage { position: relative; overflow: hidden; min-height: 31rem; }
    #sofistike-brand-prototype .hero-photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; filter: blur(15px); transform: scale(1.04); transition: opacity .7s ease, filter .7s ease, transform .7s ease; }
    #sofistike-brand-prototype .hero-photo.active { opacity: 1; filter: blur(0); transform: scale(1); }
    #sofistike-brand-prototype .hero-overlay { position: absolute; inset: auto 0 0; padding: 1rem 1.25rem; background: linear-gradient(transparent, color-mix(in srgb, var(--ink) 60%, transparent)); color: var(--paper); display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
    #sofistike-brand-prototype .hero-pager { display: flex; align-items: center; gap: .45rem; }
    #sofistike-brand-prototype .dot { width: .65rem; height: .65rem; border-radius: 50%; border: 1px solid currentColor; background: transparent; padding: 0; }
    #sofistike-brand-prototype .dot.active { background: currentColor; }

    #sofistike-brand-prototype .module-shell { background: var(--cream); }
    #sofistike-brand-prototype .module-viewport { overflow-x: auto; scrollbar-width: none; scroll-snap-type: x mandatory; }
    #sofistike-brand-prototype .module-viewport::-webkit-scrollbar { display: none; }
    #sofistike-brand-prototype .module-track { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(22rem, 32%); gap: 1rem; }
    #sofistike-brand-prototype .module-card { padding: 0; overflow: hidden; scroll-snap-align: start; }
    #sofistike-brand-prototype .module-inner { display: grid; grid-template-columns: .9fr 1.1fr; min-height: 16rem; }
    #sofistike-brand-prototype .module-text { padding: 1.15rem; display: flex; flex-direction: column; justify-content: center; }
    #sofistike-brand-prototype .module-text h3 { display: flex; gap: .5rem; align-items: center; margin-top: 0; }
    #sofistike-brand-prototype .module-card img { width: 100%; height: 100%; object-fit: cover; }
    #sofistike-brand-prototype .module-bar { height: .3rem; background: var(--primary); }
    #sofistike-brand-prototype .module-card:nth-child(3n+2) .module-bar { background: var(--viz-series-3); }
    #sofistike-brand-prototype .module-card:nth-child(3n+3) .module-bar { background: var(--viz-series-5); }
    #sofistike-brand-prototype .carousel-foot { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-top: 1rem; }

    #sofistike-brand-prototype .lab { background: var(--paper); }
    #sofistike-brand-prototype .lab-top { display: grid; grid-template-columns: minmax(15rem, .75fr) minmax(0, 1.65fr); gap: 2rem; align-items: stretch; }
    #sofistike-brand-prototype .lab-story { display: grid; grid-template-rows: auto 1fr; background: var(--cream); }
    #sofistike-brand-prototype .lab-story-copy { padding: 1.4rem; }
    #sofistike-brand-prototype .lab-story img { width: 100%; height: 100%; max-height: 23rem; object-fit: cover; }
    #sofistike-brand-prototype .lab-main { display: flex; flex-direction: column; gap: 1.5rem; }
    #sofistike-brand-prototype .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: .7rem; }
    #sofistike-brand-prototype .metric { padding: 1rem; border-block: 1px solid var(--line); }
    #sofistike-brand-prototype .metric strong { display: block; }
    #sofistike-brand-prototype .process { display: grid; grid-template-columns: repeat(5, 1fr); border-block: 1px solid var(--line); }
    #sofistike-brand-prototype .process button { padding: 1rem .7rem; border: 0; background: transparent; color: var(--ink); text-align: left; border-right: 1px solid var(--line); }
    #sofistike-brand-prototype .process button:last-child { border-right: 0; }
    #sofistike-brand-prototype .process button[aria-pressed=&quot;true&quot;] { background: var(--lavender); }
    #sofistike-brand-prototype .process button strong { display: block; margin-top: .5rem; }
    #sofistike-brand-prototype .process-detail { min-height: 6rem; padding: 1rem; background: var(--cream); }
    #sofistike-brand-prototype .lab-tabs { display: flex; gap: .45rem; flex-wrap: wrap; margin-block: 2rem 1.25rem; }
    #sofistike-brand-prototype .lab-panel[hidden] { display: none; }
    #sofistike-brand-prototype .insights { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
    #sofistike-brand-prototype .insight-card { padding: 1.15rem; }
    #sofistike-brand-prototype .insight-card:nth-child(2) { background: var(--peach); }
    #sofistike-brand-prototype .insight-card:nth-child(3) { background: var(--sage); }
    #sofistike-brand-prototype .score-box { margin-top: 1.5rem; display: grid; gap: .65rem; }
    #sofistike-brand-prototype .score { display: grid; grid-template-columns: 10rem 1fr auto; align-items: center; gap: .7rem; }
    #sofistike-brand-prototype .score-line { height: .35rem; background: var(--muted); }
    #sofistike-brand-prototype .score-line span { display: block; height: 100%; background: var(--primary); }
    #sofistike-brand-prototype .services { display: grid; grid-template-columns: repeat(3, 1fr); border-block: 1px solid var(--line); }
    #sofistike-brand-prototype .service { padding: 1.25rem; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    #sofistike-brand-prototype .service:nth-child(3n) { border-right: 0; }
    #sofistike-brand-prototype .service h3 { display: flex; gap: .5rem; align-items: center; }
    #sofistike-brand-prototype .b2b { display: grid; grid-template-columns: repeat(5, 1fr); gap: .65rem; }
    #sofistike-brand-prototype .b2b-step { padding: 1rem; background: var(--sage); }
    #sofistike-brand-prototype .co-create { margin-top: 2rem; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 1rem; padding: 1.4rem; background: var(--lavender); }

    #sofistike-brand-prototype .journey-strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
    #sofistike-brand-prototype .journey { padding: 1.3rem; }
    #sofistike-brand-prototype .journey:nth-child(2) { background: var(--sage); }
    #sofistike-brand-prototype .journey:nth-child(3) { background: var(--aqua); }
    #sofistike-brand-prototype .footer { border-top: 1px solid var(--line); padding-block: 2rem; color: var(--muted-foreground); }
    #sofistike-brand-prototype dialog { color: var(--ink); background: var(--popover); border: 1px solid var(--line); width: min(34rem, calc(100% - 2rem)); }
    #sofistike-brand-prototype dialog::backdrop { background: color-mix(in srgb, var(--ink) 35%, transparent); }

    @media (max-width: 920px) {
      #sofistike-brand-prototype .nav-row { grid-template-columns: 1fr auto; }
      #sofistike-brand-prototype .nav { grid-column: 1 / -1; justify-content: flex-start; }
      #sofistike-brand-prototype .search { display: none; }
      #sofistike-brand-prototype .mega { position: static; }
      #sofistike-brand-prototype .mega-grid { grid-template-columns: 1fr; }
      #sofistike-brand-prototype .hero { grid-template-columns: 1fr; }
      #sofistike-brand-prototype .hero-manifesto img { max-height: 25rem; }
      #sofistike-brand-prototype .module-track { grid-auto-columns: minmax(20rem, 72%); }
      #sofistike-brand-prototype .lab-top { grid-template-columns: 1fr; }
      #sofistike-brand-prototype .process { grid-template-columns: repeat(2, 1fr); }
      #sofistike-brand-prototype .metrics { grid-template-columns: repeat(2, 1fr); }
      #sofistike-brand-prototype .insights,
      #sofistike-brand-prototype .journey-strip { grid-template-columns: 1fr; }

    @media (max-width: 560px) {
      #sofistike-brand-prototype .utility-row { justify-content: flex-start; }
      #sofistike-brand-prototype .nav-actions .action-text { display: none; }
      #sofistike-brand-prototype .mega-list { grid-template-columns: 1fr; }
      #sofistike-brand-prototype .module-track { grid-auto-columns: 92%; }
      #sofistike-brand-prototype .module-inner { grid-template-columns: 1fr; }
      #sofistike-brand-prototype .module-card img { aspect-ratio: 16 / 9; }
      #sofistike-brand-prototype .section-head,
      #sofistike-brand-prototype .co-create { grid-template-columns: 1fr; align-items: start; }
      #sofistike-brand-prototype .process,
      #sofistike-brand-prototype .metrics,
      #sofistike-brand-prototype .services,
      #sofistike-brand-prototype .b2b { grid-template-columns: 1fr; }
      #sofistike-brand-prototype .service { border-right: 0; }
      #sofistike-brand-prototype .score { grid-template-columns: 1fr; }

    @media (prefers-reduced-motion: reduce) {
      #sofistike-brand-prototype .hero-photo { transition: none; }
    }
